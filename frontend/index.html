<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HandyAI — the AI tools marketplace</title>
    <meta
      name="description"
      content="Compare AI tools by price and plan, get picks for your profession, and manage every AI subscription in one place."
    />
    <meta name="theme-color" content="#050a10" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before the first paint so a light-theme visitor never sees a
      // flash of the dark page. Dark is the default.
      try {
        if (localStorage.getItem('handyai.theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f3f8fb'
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
